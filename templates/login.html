<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Bina Kasih</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">

    <a href="{{ url_for('index') }}" class="btn btn-outline flex items-center gap-2 transition-colors"
        style="position: absolute; top: 2rem; left: 2rem; text-decoration: none; font-size: 0.9rem; padding: 0.5rem 1rem; box-shadow: var(--shadow-sm); width: max-content; background: var(--white); border-radius: var(--radius);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span class="font-bold">Kembali</span>
    </a>

    <div class="auth-container" id="auth-container">
        <!-- Sign Up Container -->
        <div class="form-container sign-up-container">
            <form onsubmit="handleRegister(event)">
                <div class="flex items-center justify-center gap-1 mb-2">
                    <img src="{{ url_for('static', filename='images/logo_hand_heart.svg') }}">
                    <span class="font-bold text-primary" style="font-size: 1.5rem;">Bina Kasih</span>
                </div>
                <h3 class="font-bold text-dark mb-4">Buat Akun</h3>
                
                <div class="input-group">
                    <input type="text" id="reg-name" class="form-input" placeholder="Nama Lengkap" required>
                </div>
                <div class="input-group">
                    <input type="email" id="reg-email" class="form-input" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <input type="password" id="reg-pass" class="form-input" placeholder="Kata Sandi" required>
                </div>
                <div class="input-group">
                    <input type="password" id="reg-pass-confirm" class="form-input" placeholder="Konfirmasi Kata Sandi" required>
                </div>
                <button type="submit" class="btn btn-primary mt-4">Daftar</button>
            </form>
        </div>

        <!-- Sign In Container -->
        <div class="form-container sign-in-container">
            <form onsubmit="handleLogin(event)">
                <div class="flex items-center justify-center gap-1 mb-2">
                    <img src="{{ url_for('static', filename='images/logo_hand_heart.svg') }}">
                    <span class="font-bold text-primary" style="font-size: 1.5rem;">Bina Kasih</span>
                </div>
                <h3 class="font-bold text-dark mb-4">Masuk</h3>
                <div class="input-group">
                    <input type="email" id="login-email" class="form-input" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <input type="password" id="login-pass" class="form-input" placeholder="Kata Sandi" required>
                </div>
                <a href="#">Lupa Kata Sandi?</a>
                
                <div class="input-group mb-4 mt-2">
                    <label class="input-label" style="font-size: 0.75rem; color: #6B7280; text-align: left;">Verifikasi Keamanan</label>
                    <div class="flex items-center gap-2">
                        <div id="captcha-display" style="background: #F9FAFB; padding: 0.5rem; border-radius: var(--radius); font-weight: bold; flex-shrink: 0; min-width: 60px; text-align: center; border: 1px solid var(--border); font-size: 0.8rem;">
                            ? + ? =
                        </div>
                        <input type="number" id="login-captcha" class="form-input" placeholder="Jawaban" style="margin: 0;" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Masuk</button>
            </form>
        </div>

        <!-- Overlay Container -->
        <div class="overlay-container">
            <div class="overlay-inner">
                <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1 style="font-size: 2rem; font-weight: bold;">Selamat Datang Kembali!</h1>
                    <p>Untuk tetap terhubung dengan kami, silakan masuk dengan informasi pribadi Anda</p>
                    <button class="btn ghost" id="signInBtn">Masuk</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1 style="font-size: 2rem; font-weight: bold;">Halo, Sahabat!</h1>
                    <p>Masukkan detail pribadi Anda dan mulailah perjalanan kebaikan bersama kami</p>
                    <button class="btn ghost" id="signUpBtn">Daftar</button>
                </div>
            </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script>
        const APP_ROUTES = {
            index: '{{ url_for("index") }}'
        };
    </script>
    <script>
        const signUpButton = document.getElementById('signUpBtn');
        const signInButton = document.getElementById('signInBtn');
        const container = document.getElementById('auth-container');

        signUpButton.addEventListener('click', () => {
            container.classList.add("active");
        });

        signInButton.addEventListener('click', () => {
            container.classList.remove("active");
        });

        let currentCaptchaAnswer = 0;

        function generateCaptcha() {
            const num1 = Math.floor(Math.random() * 10) + 1;
            const num2 = Math.floor(Math.random() * 10) + 1;
            currentCaptchaAnswer = num1 + num2;
            document.getElementById('captcha-display').innerText = `${num1} + ${num2} =`;
            document.getElementById('login-captcha').value = '';
        }

        document.addEventListener('DOMContentLoaded', () => {
            generateCaptcha();
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('action') === 'register') {
                container.classList.add("active");
            }
        });

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                document.body.classList.add('page-exit');
                setTimeout(() => window.location.href = APP_ROUTES.index, 400);
            }
        });

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            const captchaInput = parseInt(document.getElementById('login-captcha').value);

            if (captchaInput !== currentCaptchaAnswer) {
                alert("Jawaban verifikasi keamanan salah. Silakan coba lagi.");
                generateCaptcha();
                return;
            }

            if (typeof auth !== 'undefined') {
                const result = await auth.login(email, pass);
                if (result.success) {
                    document.body.classList.add('page-exit');
                    setTimeout(() => window.location.href = APP_ROUTES.index, 400);
                } else {
                    alert(result.message);
                    generateCaptcha();
                }
            } else {
                // Fallback for demo purposes
                document.body.classList.add('page-exit');
                setTimeout(() => window.location.href = APP_ROUTES.index, 400);
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            const passConfirm = document.getElementById('reg-pass-confirm').value;

            // Email Validation Logic
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert("Format email tidak valid. Gunakan format seperti: nama@gmail.com");
                return;
            }

            if (name.length < 3) {
                alert("Nama lengkap minimal 3 karakter");
                return;
            }

            if (pass.length < 6) {
                alert("Kata sandi minimal 6 karakter");
                return;
            }

            if (pass !== passConfirm) {
                alert("Konfirmasi kata sandi tidak cocok");
                return;
            }

            if (typeof auth !== 'undefined') {
                const result = await auth.register(name, email, pass);
                if (result.success || result === true) {
                    alert('Pendaftaran berhasil! Silakan masuk.');
                    container.classList.remove("active");
                } else {
                    alert(result.message || 'Pendaftaran gagal');
                }
            } else {
                alert('Pendaftaran berhasil! Silakan masuk.');
                container.classList.remove("active");
            }
        }
    </script>

</body>

</html>
