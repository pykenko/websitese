services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: donasi
      POSTGRES_USER: donasi
      POSTGRES_PASSWORD: donasi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U donasi -d donasi"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  binakasih:
    build: .
    ports:
      - "6767:8000"
    environment:
      - SECRET_KEY=BINAKASIH
      - DATABASE_URL=postgresql://donasi:donasi@db:5432/donasi
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
