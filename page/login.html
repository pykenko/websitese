<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - BeriKasih</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">

    <a href="index.html" class="flex items-center gap-2 text-gray hover:text-primary transition-colors"
        style="position: absolute; top: 2rem; left: 2rem; text-decoration: none;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        <span class="font-bold">Kembali</span>
    </a>

    <div class="card" style="width: 100%; max-width: 400px; padding: 2.5rem;">
        <div class="text-center mb-8">
            <div class="flex items-center justify-center gap-1 mb-2">
                <img src="images/logo_hand_heart.svg" alt="BeriKasih Logo" style="width: 32px; height: 32px;">
                <span class="font-bold text-primary" style="font-size: 1.5rem;">BeriKasih</span>
            </div>
            <h3 class="font-bold text-dark">Selamat Datang Kembali</h3>
            <p class="text-gray">Masuk untuk melanjutkan kebaikan Anda</p>
        </div>

        <form onsubmit="handleLogin(event)">
            <div class="input-group">
                <label class="input-label">Akun (username/email)</label>
                <input type="text" id="login-email" class="form-input" placeholder="admin atau nama@email.com" required>
            </div>

            <div class="input-group">
                <label class="input-label">Kata Sandi</label>
                <input type="password" id="login-pass" class="form-input" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
            </div>

            <div class="flex justify-end mb-4">
                <a href="#" class="text-primary" style="font-size: 0.875rem;">Lupa Kata Sandi?</a>
            </div>

            <button type="submit" class="btn btn-primary w-full mb-4">Masuk</button>

            <div class="text-center text-gray" style="font-size: 0.9rem;">
                Belum punya akun? <a href="register.html" class="text-primary font-bold">Daftar</a>
            </div>

        </form>
    </div>

    <script src="app/auth.js"></script>
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const identifier = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;

            const result = await auth.login(identifier, pass);
            if (result.success) {
                // Successful login
                window.location.href = 'index.html';
            } else {
                alert(result.message);
            }
        }
    </script>

</body>

</html>
