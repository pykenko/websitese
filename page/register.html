<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Bina Kasih</title>
    <link rel="stylesheet" href="styles.css?v=2">
</head>

<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">

    <a href="index.html" class="btn btn-outline flex items-center gap-2 transition-colors"
        style="position: absolute; top: 2rem; left: 2rem; text-decoration: none; font-size: 0.9rem; padding: 0.5rem 1rem; box-shadow: var(--shadow-sm); width: max-content; background: var(--white); border-radius: var(--radius);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span class="font-bold">Kembali</span>
    </a>

    <div class="card" style="width: 100%; max-width: 400px; padding: 2.5rem;">
        <div class="text-center mb-8">
            <div class="flex items-center justify-center gap-1 mb-2">
                <img src="logo_hand_heart.svg" alt="Bina Kasih Logo" style="width: 32px; height: 32px;">
                <span class="font-bold text-primary" style="font-size: 1.5rem;">Bina Kasih</span>
            </div>
            <h3 class="font-bold text-dark">Buat Akun Baru</h3>
            <p class="text-gray">Bergabunglah dengan komunitas kebaikan</p>
        </div>

        <form onsubmit="handleRegister(event)">
            <div class="input-group">
                <label class="input-label">Nama Lengkap</label>
                <input type="text" id="reg-name" class="form-input" placeholder="Nama Anda" required>
            </div>

            <div class="input-group">
                <label class="input-label">Email</label>
                <input type="email" id="reg-email" class="form-input" placeholder="nama@gmail.com" required
                    oninput="validateGmailInput(this)">
                <small id="email-error" style="color: #e53e3e; font-size: 0.78rem; margin-top: 4px; display: none;">
                    ⚠️ Email harus menggunakan <strong>@gmail.com</strong> (contoh: nama@gmail.com)
                </small>
            </div>

            <div class="input-group">
                <label class="input-label">Kata Sandi</label>
                <input type="password" id="reg-pass" class="form-input" placeholder="••••••••" required>
            </div>

            <div class="input-group">
                <label class="input-label">Konfirmasi Kata Sandi</label>
                <input type="password" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary w-full mb-4 mt-2">Daftar</button>

            <div class="text-center text-gray" style="font-size: 0.9rem;">
                Sudah punya akun? <a href="login.html" class="text-primary font-bold">Masuk</a>
            </div>
        </form>
    </div>

    <script src="auth.js"></script>
    <script>
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                window.location.href = 'index.html';
            }
        });

        function validateGmailInput(input) {
            const errorEl = document.getElementById('email-error');
            const isValid = /^[a-zA-Z0-9._%+\-]+@gmail\.com$/.test(input.value);
            if (input.value.length > 0 && !isValid) {
                input.style.borderColor = '#e53e3e';
                input.style.boxShadow = '0 0 0 3px rgba(229,62,62,0.15)';
                errorEl.style.display = 'block';
            } else {
                input.style.borderColor = '';
                input.style.boxShadow = '';
                errorEl.style.display = 'none';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const pass = document.getElementById('reg-pass').value;
            const errorEl = document.getElementById('email-error');

            // Strict @gmail.com validation
            const gmailRegex = /^[a-zA-Z0-9._%+\-]+@gmail\.com$/;
            if (!gmailRegex.test(email)) {
                const emailInput = document.getElementById('reg-email');
                emailInput.style.borderColor = '#e53e3e';
                emailInput.style.boxShadow = '0 0 0 3px rgba(229,62,62,0.15)';
                errorEl.style.display = 'block';
                emailInput.focus();
                return;
            }

            const result = await auth.register(name, email, pass);
            if (result && result.success === false) {
                alert('Pendaftaran gagal: ' + (result.message || 'Terjadi kesalahan.'));
                return;
            }
            alert('Pendaftaran berhasil! Silakan masuk.');
            window.location.href = 'login.html';
        }
    </script>

</body>

</html>
