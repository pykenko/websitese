<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - BeriKasih</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">

    <a href="index.html" class="flex items-center gap-2 text-gray hover:text-primary transition-colors"
        style="position: absolute; top: 2rem; left: 2rem; text-decoration: none;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        <span class="font-bold">Kembali</span>
    </a>

    <div class="card" style="width: 100%; max-width: 400px; padding: 2.5rem;">
        <div class="text-center mb-8">
            <div class="flex items-center justify-center gap-1 mb-2">
                <img src="images/logo_hand_heart.svg" alt="BeriKasih Logo" style="width: 32px; height: 32px;">
                <span class="font-bold text-primary" style="font-size: 1.5rem;">BeriKasih</span>
            </div>
            <h3 class="font-bold text-dark">Buat Akun Baru</h3>
            <p class="text-gray">Bergabunglah dengan komunitas kebaikan</p>
        </div>

        <form onsubmit="handleRegister(event)">
            <div class="input-group">
                <label class="input-label">Nama Lengkap</label>
                <input type="text" id="reg-name" class="form-input" placeholder="Nama Anda" required>
            </div>

            <div class="input-group">
                <label class="input-label">Email</label>
                <input type="email" id="reg-email" class="form-input" placeholder="nama@email.com" required>
            </div>

            <div class="input-group">
                <label class="input-label">Kata Sandi</label>
                <input type="password" id="reg-pass" class="form-input" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
            </div>

            <div class="input-group">
                <label class="input-label">Konfirmasi Kata Sandi</label>
                <input type="password" id="reg-pass-confirm" class="form-input" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
            </div>

            <button type="submit" class="btn btn-primary w-full mb-4 mt-2">Daftar</button>

            <div class="text-center text-gray" style="font-size: 0.9rem;">
                Sudah punya akun? <a href="login.html" class="text-primary font-bold">Masuk</a>
            </div>
        </form>
    </div>

    <script src="app/auth.js"></script>
    <script>
        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            const passConfirm = document.getElementById('reg-pass-confirm').value;

            if (pass !== passConfirm) {
                alert('Konfirmasi kata sandi tidak cocok.');
                return;
            }

            const result = await auth.register(name, email, pass);
            if (!result.success) {
                alert(result.message);
                return;
            }

            alert('Pendaftaran berhasil! Silakan masuk.');
            window.location.href = 'login.html';
        }
    </script>

</body>

</html>
